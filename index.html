<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calc</title>
</head>
<body>
    <div id="calc">
        <div id="input"></div>
        <div id="display">0</div>
        <div id="keys">
            <button class="opr" onclick="atd('+')">+</button>
            <button onclick="atd('7')">7</button>
            <button onclick="atd('8')">8</button>
            <button onclick="atd('9')">9</button>

            <button class="opr" onclick="atd('-')">-</button>
            <button onclick="atd('4')">4</button>
            <button onclick="atd('5')">5</button>
            <button onclick="atd('6')">6</button>

            <button class="opr" onclick="atd('*')">*</button>
            <button onclick="atd('1')">1</button>
            <button onclick="atd('2')">2</button>
            <button onclick="atd('3')">3</button>

            <button class="opr" onclick="atd('/')">/</button>
            <button onclick="atd('0')">0</button>
            <button onclick="atd('.')">.</button>
            <button class="eql" onclick="eql()">=</button>

            <button class="opr" onclick="clears()">C</button>
            <button class="opr" onclick="del()">Del</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
